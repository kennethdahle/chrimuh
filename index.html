<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/chrimuh/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chrimuh – keep track of your Christmas gift shopping.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1B4A37">
  <meta name="apple-mobile-web-app-title" content="Chrimuh">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chrimuh</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #F4F6F6; overflow: hidden; overscroll-behavior: none; }
  </style>
  <script>
    // Safari på iPhone skyver siden opp når tastaturet kommer, og glemmer å skyve den tilbake.
    (function () {
      function reset() {
        if (window.scrollY !== 0 || document.documentElement.scrollTop !== 0 || document.body.scrollTop !== 0) {
          window.scrollTo(0, 0);
          document.documentElement.scrollTop = 0;
          document.body.scrollTop = 0;
        }
      }
      function soon() { setTimeout(reset, 30); setTimeout(reset, 300); }
      document.addEventListener('focusout', soon, true);
      window.addEventListener('scroll', function () { if (!document.activeElement || document.activeElement === document.body) soon(); });
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', function () {
          if (window.visualViewport.height >= window.innerHeight - 1) soon();
        });
      }
    })();
  </script>
  <script>
    // iPhone-hjemskjermapp: Safari gir siden høyden «skjerm minus statuslinje», så det
    // blir en tom stripe nederst. Her strekkes appen til hele skjermhøyden.
    (function () {
      if (!window.navigator.standalone) return;
      var root = document.documentElement;
      root.classList.add('standalone');
      var ch = Object.getOwnPropertyDescriptor(Element.prototype, 'clientHeight');
      function raw() { return ch.get.call(root); }
      function full() {
        var portrait = window.matchMedia('(orientation: portrait)').matches;
        return portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
      }
      function gap() {
        var d = full() - raw();
        return d > 0 && d < 120 ? d : 0;
      }
      Object.defineProperty(root, 'clientHeight', { configurable: true, get: function () { return raw() + gap(); } });
      function apply() {
        var g = gap();
        root.classList.toggle('stretch', g > 0);
        root.style.setProperty('--full-h', (raw() + g) + 'px');
      }
      apply();
      window.addEventListener('resize', apply);
      window.addEventListener('orientationchange', function () { setTimeout(apply, 300); });
    })();
  </script>
  <style>
    html.stretch, html.stretch body { height: var(--full-h) !important; }
    html.stretch body { bottom: auto !important; }
    /* iOS 27 legger en tone bak statuslinja basert på sidens bakgrunn: gjør den grønn som banneret. */
    html.standalone, html.standalone body { background: #1B4A37; }
  </style>
  <script>
    // Lyd med Web Audio: rask respons, og «ambient» så den blander seg med musikk og
    // video i bakgrunnen (og følger lydløs-bryteren) i stedet for å pause dem.
    window.chrimuhSound = (function () {
      try { if (navigator.audioSession) navigator.audioSession.type = 'ambient'; } catch (e) {}
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      var ctx = new Ctx({ latencyHint: 'interactive' });
      var buf = {}, loopSrc = null;
      function load(name) {
        fetch('assets/assets/sounds/' + name + '.wav')
          .then(function (r) { return r.arrayBuffer(); })
          .then(function (a) { return new Promise(function (ok, no) { ctx.decodeAudioData(a, ok, no); }); })
          .then(function (b) { buf[name] = b; })
          .catch(function () {});
      }
      [50, 52, 54, 55, 57, 58, 60, 62, 63, 65, 67].forEach(function (n) { load('note_' + n); });
      load('loop');
      function unlock() { if (ctx.state !== 'running') ctx.resume(); }
      ['pointerdown', 'touchstart', 'touchend', 'click'].forEach(function (e) {
        document.addEventListener(e, unlock, true);
      });
      var live = {}, nextId = 1;
      function play(name, gain) {
        var b = buf[name];
        if (!b) return null;
        unlock();
        var s = ctx.createBufferSource();
        s.buffer = b;
        if (gain) { s.connect(gain); gain.connect(ctx.destination); } else { s.connect(ctx.destination); }
        s.start();
        return s;
      }
      return {
        note: function (n) {
          var g = ctx.createGain();
          var s = play('note_' + n, g);
          if (!s) return 0;
          var id = nextId++;
          live[id] = { s: s, g: g };
          s.onended = function () { delete live[id]; };
          return id;
        },
        // Stopp en bjelle raskt (fingeren begynte å scrolle i stedet for å trykke).
        cancel: function (id) {
          var x = live[id];
          if (!x) return;
          delete live[id];
          var t = ctx.currentTime;
          x.g.gain.cancelScheduledValues(t);
          x.g.gain.setValueAtTime(x.g.gain.value, t);
          x.g.gain.linearRampToValueAtTime(0, t + 0.03);
          try { x.s.stop(t + 0.04); } catch (e) {}
        },
        loop: function (on) {
          if (on) {
            if (loopSrc) return;
            loopSrc = play('loop');
            if (loopSrc) loopSrc.loop = true;
          } else if (loopSrc) {
            try { loopSrc.stop(); } catch (e) {}
            loopSrc = null;
          }
        }
      };
    })();
  </script>
</head>
